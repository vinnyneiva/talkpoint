<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png">
  <title>TalkPoint</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; }
    #display { font-size: 5rem; font-weight: bold; text-transform: uppercase; margin: 50px 0; min-height: 150px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
    input { padding: 15px; width: 80%; font-size: 1.2rem; border-radius: 8px; border: none; }
    button { padding: 15px 30px; font-size: 1.2rem; margin-top: 20px; cursor: pointer; background: #00ffcc; border: none; font-weight: bold; border-radius: 8px; }
  </style>
</head>
<body>
  <button id="btnMenu" style="position: fixed; top: 20px; left: 20px; z-index: 1001; background: none; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px; border-radius: 5px; transition: 0.3s; min-width: 45px;">☰ Frases</button>

  <nav id="sidebar" style="position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #111; border-right: 2px solid #00ffcc; transition: 0.3s; z-index: 1000; padding: 20px; overflow-y: auto;">
    <h3 style="color: #00ffcc; margin-top: 60px;">MEUS FAVORITOS</h3>
    <p style="color: #666; font-size: 0.8rem; margin-bottom: 20px;">Dê 2 cliques para apagar</p>
    
    <div id="favoritos" style="display: flex; flex-direction: column; gap: 10px;">
      </div>
    
    <button id="btnClose" style="margin-top: 30px; width: 100%; background: #222; color: #ff5555; border: 1px solid #ff5555;">FECHAR MENU</button>
  </nav>

  <div id="display">TALKPOINT</div>

  <div class="controls">
    <input type="text" id="texto" placeholder="O que você quer dizer?" autocomplete="off">
    
    <div style="margin: 10px 0; color: #00ffcc; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <label><input type="checkbox" id="checkVoz" checked> Ativar Voz</label>
    </div>

    <div style="display: flex; gap: 10px; width: 100%;">
      <button id="btnFalar" style="flex: 2;">MOSTRAR / FALAR</button>
      <button id="btnSalvar" style="flex: 1; background: #333; color: #00ffcc; border: 1px solid #00ffcc;">SALVAR</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
